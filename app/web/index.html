<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Notifier</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus"></script>
</head>
<body>
<div id="app" style="max-width:1100px;margin:24px auto;padding:12px;">
  <h2>Smart-Notifier 管理端</h2>

  <el-card v-if="!authed" style="max-width:460px;margin:30px auto;">
    <template #header>登录</template>
    <el-form label-width="90px">
      <el-form-item label="用户名"><el-input v-model="login.username"/></el-form-item>
      <el-form-item label="密码"><el-input v-model="login.password" type="password" show-password/></el-form-item>
      <el-form-item><el-button type="primary" @click="doLogin">登录</el-button></el-form-item>
    </el-form>
  </el-card>

  <div v-else>
    <el-form :inline="true" @submit.prevent>
      <el-form-item label="Chat ID"><el-input v-model="chatId" placeholder="可选" style="width:180px"/></el-form-item>
      <el-form-item>
        <el-select v-model="statusFilter" style="width:140px">
          <el-option label="全部" value=""/><el-option label="待办" value="pending"/><el-option label="完成" value="completed"/>
        </el-select>
      </el-form-item>
      <el-form-item><el-button type="primary" @click="load">刷新</el-button></el-form-item>
      <el-form-item><el-button @click="logout">退出</el-button></el-form-item>
    </el-form>

    <el-card>
      <template #header>新建任务</template>
      <el-form label-width="120px">
        <el-form-item label="目标 Chat ID"><el-input v-model="form.chat_id"/></el-form-item>
        <el-form-item label="内容"><el-input v-model="form.content"/></el-form-item>
        <el-form-item label="备注"><el-input v-model="form.remarks"/></el-form-item>
        <el-form-item label="提醒类型">
          <el-radio-group v-model="form.is_recurring">
            <el-radio :value="false">一次性</el-radio>
            <el-radio :value="true">周期循环</el-radio>
          </el-radio-group>
        </el-form-item>
        <el-form-item v-if="!form.is_recurring" label="提醒时间"><el-input v-model="form.once_time" placeholder="2026-05-04 10:00"/></el-form-item>

        <template v-else>
          <el-form-item label="循环方式">
            <el-radio-group v-model="form.recurring_mode">
              <el-radio value="weekly">每周</el-radio>
              <el-radio value="monthly">每月</el-radio>
              <el-radio value="quarterly">每季度</el-radio>
              <el-radio value="yearly">每年</el-radio>
              <el-radio value="interval_days">每隔N天</el-radio>
            </el-radio-group>
          </el-form-item>
          <el-form-item label="时间(HH:MM)"><el-input v-model="form.hhmm" style="width:160px"/></el-form-item>
          <el-form-item v-if="form.recurring_mode==='weekly'" label="周几">
            <el-select v-model="form.weekday" style="width:120px"><el-option label="一" value="1"/><el-option label="二" value="2"/><el-option label="三" value="3"/><el-option label="四" value="4"/><el-option label="五" value="5"/><el-option label="六" value="6"/><el-option label="日" value="7"/></el-select>
          </el-form-item>
          <el-form-item v-if="form.recurring_mode==='monthly' || form.recurring_mode==='quarterly'" label="日期(1-31)"><el-input v-model="form.month_day" style="width:120px"/></el-form-item>
          <el-form-item v-if="form.recurring_mode==='yearly'" label="日期(MM-DD)"><el-input v-model="form.year_mmdd" style="width:140px"/></el-form-item>
          <el-form-item v-if="form.recurring_mode==='interval_days'" label="间隔天数"><el-input v-model="form.interval_days" style="width:120px"/></el-form-item>
        </template>
        <el-form-item><el-button type="success" @click="createTask">创建</el-button></el-form-item>
      </el-form>
    </el-card>

    <div style="margin-top:16px;display:grid;gap:12px;">
      <el-card v-for="t in tasks" :key="t.id">
        <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;">
          <div>
            <div><b>ID:</b> {{t.id}} | <b>ChatID:</b> {{t.chat_id}}</div>
            <div><b>内容:</b> {{t.content}}</div>
            <div><b>提醒时间:</b> {{t.trigger_time || '-'}} | <b>下次提醒:</b> {{t.next_run_time || '-'}}</div>
            <div><b>循环规则:</b> {{t.rule_text || t.cron_expr || '-'}}</div>
            <div><b>提醒类型:</b> {{t.reminder_type || (t.is_recurring?'周期':'一次性')}} | <b>状态:</b> {{t.status}}</div>
          </div>
          <div style="display:flex;gap:8px;align-items:flex-start;">
            <el-button size="small" @click="openEdit(t)">✏️修改</el-button>
            <el-button size="small" type="success" :disabled="t.status==='completed'" @click="markDone(t)">完成</el-button>
            <el-button size="small" type="danger" @click="deleteTask(t)">删除</el-button>
          </div>
        </div>
      </el-card>
      <el-empty v-if="tasks.length===0" description="暂无任务" />
    </div>

    <el-dialog v-model="edit.visible" title="修改任务" width="560px">
      <el-form label-width="110px">
        <el-form-item label="内容"><el-input v-model="edit.form.content"/></el-form-item>
        <el-form-item label="备注"><el-input v-model="edit.form.remarks"/></el-form-item>
        <el-form-item label="提醒时间"><el-input v-model="edit.form.trigger_time" placeholder="2026-05-04 10:00"/></el-form-item>
        <el-form-item label="循环规则"><el-input v-model="edit.form.cron_expr" placeholder="可留空"/></el-form-item>
        <el-form-item label="状态"><el-select v-model="edit.form.status" style="width:160px"><el-option value="pending" label="pending"/><el-option value="completed" label="completed"/></el-select></el-form-item>
      </el-form>
      <template #footer><el-button @click="edit.visible=false">取消</el-button><el-button type="primary" @click="saveEdit">保存</el-button></template>
    </el-dialog>
  </div>
</div>

<script>
const { createApp, ref } = Vue
createApp({
  setup() {
    const auth = ref(localStorage.getItem('sn_basic_auth') || '')
    const authed = ref(!!auth.value)
    const login = ref({username:'', password:''})
    const chatId = ref('')
    const statusFilter = ref('')
    const tasks = ref([])
    const form = ref({ chat_id:'', content:'', remarks:'', is_recurring:false, once_time:'', recurring_mode:'weekly', hhmm:'09:30', weekday:'1', month_day:'1', year_mmdd:'01-01', interval_days:'3' })
    const edit = ref({ visible:false, taskId:null, form:{ content:'', remarks:'', trigger_time:'', cron_expr:'', status:'pending' } })

    const authFetch = (url, options={}) => fetch(url, Object.assign({}, options, { headers: Object.assign({}, options.headers || {}, auth.value ? { Authorization: `Basic ${auth.value}` } : {}) }))
    const logout = () => { localStorage.removeItem('sn_basic_auth'); auth.value=''; authed.value=false }

    const doLogin = async () => {
      const token = btoa(`${login.value.username}:${login.value.password}`)
      const res = await fetch('/api/tasks', { headers: { Authorization: `Basic ${token}` } })
      if (res.status===401) return ElementPlus.ElMessage.error('账号或密码错误')
      auth.value = token; localStorage.setItem('sn_basic_auth', token); authed.value = true; await load()
    }

    const recurringExpr = () => {
      const [hh, mm] = form.value.hhmm.split(':'); if (!hh || !mm) throw new Error('时间格式为HH:MM')
      const h=parseInt(hh,10), m=parseInt(mm,10), mode=form.value.recurring_mode
      if (mode==='weekly') return `${m} ${h} * * ${form.value.weekday==='7'?0:form.value.weekday}`
      if (mode==='monthly') return `${m} ${h} ${parseInt(form.value.month_day,10)} * *`
      if (mode==='quarterly') return `${m} ${h} ${parseInt(form.value.month_day,10)} 1,4,7,10 *`
      if (mode==='yearly') { const [mon,day]=form.value.year_mmdd.split('-'); return `${m} ${h} ${parseInt(day,10)} ${parseInt(mon,10)} *` }
      if (mode==='interval_days') return `every_ndays:${parseInt(form.value.interval_days,10)}:${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`
      throw new Error('未知循环方式')
    }

    const load = async () => {
      const p = new URLSearchParams(); if (chatId.value) p.set('chat_id', chatId.value); if (statusFilter.value) p.set('status', statusFilter.value)
      const res = await authFetch(`/api/tasks${p.toString()?`?${p.toString()}`:''}`)
      if (res.status===401) return logout(); if (!res.ok) return ElementPlus.ElMessage.error('查询失败')
      tasks.value = await res.json()
    }

    const createTask = async () => {
      try {
        if (!form.value.chat_id || !form.value.content) return ElementPlus.ElMessage.error('请填写Chat ID和内容')
        const payload = { content: form.value.content, remarks: form.value.remarks, is_recurring: form.value.is_recurring, trigger_time: form.value.is_recurring?null:form.value.once_time, cron_expr: form.value.is_recurring?recurringExpr():null, chat_id: form.value.chat_id }
        const res = await authFetch('/api/tasks', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) })
        if (res.status===401) return logout(); if (!res.ok) return ElementPlus.ElMessage.error(await res.text())
        await load(); ElementPlus.ElMessage.success('创建成功')
      } catch(e){ ElementPlus.ElMessage.error(e.message || '创建失败') }
    }

    const openEdit = (t) => { edit.value.taskId=t.id; edit.value.form={content:t.content||'',remarks:t.remarks||'',trigger_time:t.trigger_time||'',cron_expr:t.cron_expr||'',status:t.status||'pending'}; edit.value.visible=true }
    const saveEdit = async () => {
      const payload = { ...edit.value.form }
      if (!payload.trigger_time) delete payload.trigger_time
      const res = await authFetch(`/api/tasks/${edit.value.taskId}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) })
      if (res.status===401) return logout(); if (!res.ok) return ElementPlus.ElMessage.error(await res.text())
      edit.value.visible=false; await load(); ElementPlus.ElMessage.success('修改成功')
    }
    const markDone = async (t) => { const r=await authFetch(`/api/tasks/${t.id}/status`, {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'completed'})}); if(r.status===401)return logout(); if(!r.ok)return ElementPlus.ElMessage.error('更新失败'); await load() }
    const deleteTask = async (t) => { const r=await authFetch(`/api/tasks/${t.id}`, {method:'DELETE'}); if(r.status===401)return logout(); if(!r.ok)return ElementPlus.ElMessage.error('删除失败'); await load() }

    if (authed.value) load()
    return { authed, login, doLogin, logout, chatId, statusFilter, tasks, form, createTask, load, edit, openEdit, saveEdit, markDone, deleteTask }
  }
}).use(ElementPlus).mount('#app')
</script>
</body>
</html>
